# =========================================================================
# PHARMATCH AI NGINX DEPLOYMENT CONFIGURATION (BOOTSTRAP)
# =========================================================================

# -------------------------------------------------------------------------
# 1. FRONTEND: Next.js App (Domain: pharmatcher.bya3online.com)
# -------------------------------------------------------------------------
server {
    listen 80;
    server_name pharmatcher.bya3online.com;

    # Next.js Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Security & Real IP forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Enable Gzip compression for faster initial loads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

# -------------------------------------------------------------------------
# 2. BACKEND: FastAPI Server (Subdomain: pharmatcher-api.bya3online.com)
# -------------------------------------------------------------------------
server {
    listen 80;
    server_name pharmatcher-api.bya3online.com;

    # FastAPI Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        
        # Clear upgrade headers for standard HTTP/1.1 SSE compatibility
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        
        # Disable gzip compression on backend to prevent stream buffering
        gzip off;
        
        # Real IP Forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL OPTIMIZATIONS FOR STREAMING (SSE matching & crawler telemetry)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        
        # CORS & Payload configurations
        client_max_body_size 50M; # Essential for large Excel sheet uploads
    }
}
